dataset_root: data/raw/eegmmidb
output_root: data/processed
subjects:
  - S001
runs:
  - R01
  - R02
sampling_rate:
  target_hz: 128
  native_hz: 160
random_seed: 42
bandpass:
  enabled: true
  l_freq: 1.0
  h_freq: 40.0
notch:
  enabled: true
  frequencies:
    - 50.0
    - 60.0
save_filtered: true
overwrite: true
ica:
  enabled: false
  method: placeholder
epoch:
  enabled: false
  duration_seconds: 2.0
  overlap_seconds: 0.0
quality_control:
  enabled: false
  amplitude_threshold_uv: 100.0
bad_channels:
  enabled: true
  detection_method: variance
  interpolation_method: spline
  max_bad_channels: 4
  random_seed: 42
