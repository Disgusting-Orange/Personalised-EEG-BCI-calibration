dataset_root: data/raw/eegmmidb
output_root: data/processed
subjects:
  - S001
runs:
  - R01
  - R02
sampling_rate:
  target_hz: 128
  native_hz: 160
random_seed: 42
bandpass:
  enabled: true
  l_freq: 1.0
  h_freq: 40.0
notch:
  enabled: true
  frequencies:
    - 50.0
    - 60.0
save_filtered: true
overwrite: true
ica:
  enabled: true
  method: fastica
  n_components: 15
  random_seed: 42
  max_iter: 1000
  reject: null
  auto_detect_eog: true
  auto_detect_ecg: true
  save_ica_model: true
epoch:
  enabled: true
  duration_seconds: 2.0
  overlap_seconds: 0.0
  reject_by_annotation: true
  baseline: null
  preload: true
  save_epochs: true
quality_control:
  enabled: true
  save_report: true
  save_plots: true
  report_format: json
  output_directory: outputs/preprocessed/qc
  amplitude_threshold_uv: 100.0
bad_channels:
  enabled: true
  detection_method: variance
  interpolation_method: spline
  max_bad_channels: 4
  random_seed: 42
