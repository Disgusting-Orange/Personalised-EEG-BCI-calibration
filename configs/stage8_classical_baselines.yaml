stage: 8
targets_dir: outputs/targets
features_dir: outputs/features
connectivity_dir: outputs/connectivity
output_directory: outputs/benchmark/stage8
ledger_path: reports/benchmark_ledger.csv
loso_splits_path: outputs/benchmark/loso_splits.json

default_feature_set: spectral_concatenated  # Options: spectral_concatenated, spectral_plus_wpli, regional_aggregated

random_seed: 42
n_jobs: 8
inner_cv_folds: 5

models:
  - dummy
  - ridge
  - lasso
  - elasticnet
  - svr
  - rf
  - xgboost

bootstrap_iterations: 1000
permutation_iterations: 1000

hpo_grids:
  ridge:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  lasso:
    alpha: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  elasticnet:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0]
    l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
  svr:
    C: [0.01, 0.1, 1.0, 10.0, 100.0]
    gamma: [scale, auto, 0.001, 0.01, 0.1]
    epsilon: [0.001, 0.01, 0.1]
  rf:
    n_estimators: [50, 100, 200]
    max_depth: [3, 5, 8, null]
    min_samples_leaf: [1, 3, 5]
    max_features: [sqrt, log2, 0.3]
  xgboost:
    n_estimators: [50, 100]
    max_depth: [3, 5]
    learning_rate: [0.05]
