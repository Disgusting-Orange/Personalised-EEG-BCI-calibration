stage: 11
graph_dataset_dir: outputs/graph_dataset/wpli_alpha_full_spectral_top20
output_directory: outputs/benchmark/stage11
ledger_path: reports/benchmark_ledger.csv
loso_splits_path: outputs/benchmark/loso_splits.json

random_seed: 42
n_jobs: 8

model:
  in_channels: 10
  hidden_channels: 64
  num_layers: 3
  dropout: 0.2
  pooling: mean
  use_jk: false

training:
  epochs: 150
  batch_size: 16
  lr: 0.005
  weight_decay: 0.0001
  patience: 25
  min_lr: 0.00001
  loss_function: variance_mse
  scheduler: plateau
  target_normalization: false

bootstrap_iterations: 1000
